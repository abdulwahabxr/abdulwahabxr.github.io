<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdul Wahab — Coming Soon</title>
  <meta name="description" content="Abdul Wahab — Unity Developer & AR Specialist. Portfolio coming soon." />
  <meta name="theme-color" content="#0a0d0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0a0d0a; --text:#e8eee6; --muted:#93a08d;
      --accent:#4dff88; --accent-dim:#2fae5f;
      --line:#26301f; --glow:rgba(77,255,136,.18);
      --mono:"JetBrains Mono",ui-monospace,monospace;
      --display:"Space Grotesk",system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;background:var(--bg);color:var(--text);
      font-family:var(--display);display:flex;align-items:center;justify-content:center;
      padding:32px;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
    }
    .grid{
      position:absolute;inset:-2px;
      background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:46px 46px;opacity:.5;
      mask-image:radial-gradient(ellipse 65% 60% at 50% 45%,#000,transparent 78%);
      -webkit-mask-image:radial-gradient(ellipse 65% 60% at 50% 45%,#000,transparent 78%);
      animation:drift 24s linear infinite;
    }
    @keyframes drift{to{background-position:46px 46px,46px 46px}}
    .glow{
      position:absolute;top:-15%;left:50%;transform:translateX(-50%);
      width:600px;height:600px;pointer-events:none;
      background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(20px);
    }
    .wrap{position:relative;text-align:center;max-width:640px}
    .eyebrow{
      font-family:var(--mono);color:var(--accent);font-size:.85rem;
      letter-spacing:.02em;margin-bottom:22px;
    }
    .eyebrow .cursor{display:inline-block;width:9px;height:1.05em;background:var(--accent);
      margin-left:4px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    h1{
      font-weight:700;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1.02;
      letter-spacing:-.02em;margin-bottom:20px;
    }
    h1 .accent{color:var(--accent)}
    .name{
      font-family:var(--mono);font-size:clamp(.95rem,3vw,1.2rem);
      color:var(--text);margin-bottom:10px;
    }
    .role{font-family:var(--mono);color:var(--muted);font-size:.9rem;margin-bottom:34px}
    .role .pipe{color:var(--accent)}
    .bar{
      max-width:340px;margin:0 auto 34px;height:6px;border-radius:999px;
      background:#141a13;border:1px solid var(--line);overflow:hidden;
    }
    .bar span{
      display:block;height:100%;width:62%;border-radius:999px;
      background:linear-gradient(90deg,var(--accent-dim),var(--accent));
      box-shadow:0 0 12px var(--glow);animation:load 2.6s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes load{from{width:0}to{width:62%}}
    .contact{font-family:var(--mono);font-size:.88rem;color:var(--muted)}
    .contact a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
    .contact a:hover{border-color:var(--accent)}
    @media(prefers-reduced-motion:reduce){
      *{animation:none!important}
      .bar span{width:62%}
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="wrap">
    <p class="eyebrow">// building<span class="cursor"></span></p>
    <h1>Under<br><span class="accent">Construction</span></h1>
    <p class="name">Abdul Wahab</p>
    <p class="role">Enterprise XR Developer <span class="pipe">(</span>AR/VR<span class="pipe">)</span></p>
    <p class="role" style="margin-top:-24px">Unity <span class="pipe">·</span> Meta Quest <span class="pipe">·</span> Training &amp; Simulation</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p class="contact">
      Portfolio launching soon —
      <a href="mailto:hello@abdulwahabxr.com">hello@abdulwahabxr.com</a>
    </p>
  </main>
</body>
</html>
